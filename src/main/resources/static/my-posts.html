<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Posts — Spring Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #121212;
      --card: #1b1b1b;
      --card-2: #232323;
      --line: #2c2c2c;
      --line-2: #3a3a3a;
      --text: #ffffff;
      --text-2: #b4b4b4;
      --text-3: #7d7d7d;
      --blue: #2563ff;
      --blue-2: #1d4fe0;
      --blue-soft: rgba(37,99,255,.16);
      --red: #e5484d;
      --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    * { -webkit-tap-highlight-color: transparent; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    ::selection { background: var(--blue); color: #fff; }
    input, textarea, select { accent-color: var(--blue); caret-color: var(--blue); }
    .wrap { max-width: 1240px; margin: 0 auto; padding-left: 64px; padding-right: 64px; }

    /* ---------- Buttons & inputs ---------- */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 999px;
      padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, color .15s; color: var(--text); background: none; white-space: nowrap; }
    .btn.primary { background: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-2); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn.outline { border-color: var(--line-2); }
    .btn.outline:hover { border-color: var(--text-3); background: var(--card-2); }
    .btn.white { background: #fff; color: #111; }
    .btn.white:hover { background: #e8ecf5; }
    .btn.danger { border-color: #5a2a2c; color: #ff8a80; }
    .btn.danger:hover { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.danger-solid { background: var(--red); color: #fff; }
    .btn.danger-solid:hover { background: #c93b40; }
    .btn.sm { padding: 7px 14px; font-size: 13px; }
    .linkbtn { background: none; border: none; padding: 6px 4px; font-size: 14px; font-weight: 600; color: var(--text-2); cursor: pointer; }
    .linkbtn:hover { color: #fff; }
    .in { width: 100%; border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 14px; color: var(--text); background: var(--card-2); }
    .in::placeholder { color: var(--text-3); }
    .in:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    select.in { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #999 50%), linear-gradient(135deg, #999 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
    textarea.in { resize: vertical; line-height: 1.6; }
    input[type=file].in { padding: 9px 12px; }

    /* ---------- Nav ---------- */
    .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 96px; border-bottom: 1px solid var(--line); gap: 28px; }
    .nav > .logo { justify-self: start; }
    .nav > .actions { justify-self: end; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: .02em; text-transform: uppercase; }
    .logo-mark { width: 36px; height: 36px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; }
    .logo-mark svg { width: 18px; height: 18px; }
    .menu { display: flex; align-items: center; gap: 34px; }
    .menu a { color: var(--text-2); font-size: 13.5px; font-weight: 500; padding: 6px 0; }
    .menu a:hover, .menu .on { color: #fff; font-weight: 700; }
    .actions { display: flex; align-items: center; gap: 16px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; object-fit: cover; }
    .who .avatar { width: 40px; height: 40px; border: 2px solid var(--line-2); }

    /* ---------- Page head ---------- */
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin: 40px 0 28px; }
    .crumb { font-size: 13px; color: var(--text-3); margin-bottom: 10px; }
    .crumb a:hover { color: #fff; }
    .head h1 { margin: 0 0 6px; font-size: clamp(26px, 3.2vw, 36px); font-weight: 700; letter-spacing: -.015em; }
    .head p { margin: 0; color: var(--text-3); font-size: 14px; }

    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-bottom: 28px; }
    .stat { border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; background: var(--card); }
    .stat .k { font-size: 12.5px; color: var(--text-3); margin-bottom: 6px; }
    .stat .v { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
    .stat .v small { font-size: 13px; font-weight: 500; color: var(--text-2); }

    .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .search { position: relative; flex: 1; max-width: 360px; }
    .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-2); pointer-events: none; }
    .search input { width: 100%; border: 1px solid transparent; background: var(--card-2); border-radius: 999px; padding: 12px 16px 12px 44px; font: inherit; font-size: 13.5px; color: #fff; }
    .search input::placeholder { color: var(--text-3); }
    .search input:focus { outline: none; border-color: var(--blue); }
    .toolbar select { width: auto; border-radius: 999px; padding: 11px 40px 11px 18px; font-size: 13.5px; }
    .count { margin-left: auto; font-size: 13px; color: var(--text-3); }

    /* ---------- Post list ---------- */
    .list { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--card); margin-bottom: 70px; }
    .list-head, .item { display: grid; grid-template-columns: 96px minmax(0, 1fr) 120px 120px 250px; gap: 22px; align-items: center; padding: 16px 22px; }
    .list-head { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); background: #171717; border-bottom: 1px solid var(--line); padding-top: 13px; padding-bottom: 13px; }
    .item { border-bottom: 1px solid var(--line); transition: background .15s; }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #202020; }
    .thumb { width: 96px; height: 70px; border-radius: 12px; overflow: hidden; background: var(--card-2); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ph { width: 100%; height: 100%; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--c) 55%, #1b1b1b), #161616 80%); color: rgba(255,255,255,.85); font-weight: 800; font-size: 26px; }
    .item h3 { margin: 0 0 4px; font-size: 15.5px; font-weight: 700; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item h3 a:hover { color: #9db8ff; }
    .item .ex { margin: 0; font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--text-2); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
    .date { font-size: 12.5px; color: var(--text-2); }
    .date small { display: block; color: var(--text-3); font-size: 11.5px; }
    .ops { display: flex; gap: 8px; justify-content: flex-end; }

    .empty { text-align: center; padding: 64px 20px; }
    .empty .ico { width: 60px; height: 60px; border-radius: 50%; background: var(--blue-soft); color: #9db8ff; display: grid; place-items: center; margin: 0 auto 16px; }
    .empty h2 { margin: 0 0 8px; font-size: 20px; }
    .empty p { margin: 0 0 20px; color: var(--text-3); font-size: 14px; }
    .skel { height: 70px; margin: 16px 22px; border-radius: 12px; background: linear-gradient(90deg, var(--card), var(--card-2), var(--card)); background-size: 200% 100%; animation: sh 1.4s infinite; }
    @keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    footer { border-top: 1px solid var(--line); padding: 26px 0; font-size: 12px; color: var(--text-3); }
    footer .wrap { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

    /* ---------- Overlays ---------- */
    .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.7); overflow-y: auto; padding: 40px 16px; opacity: 0; transition: opacity .18s; }
    .overlay.show { opacity: 1; }
    .sheet { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 20px; margin: 0 auto; max-width: 640px; transform: translateY(14px); transition: transform .18s; overflow: hidden; }
    .overlay.show .sheet { transform: none; }
    .close { position: absolute; top: 14px; right: 14px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--card-2); color: #fff; font-size: 22px; line-height: 1; cursor: pointer; }
    .close:hover { background: var(--blue); }
    .composer { padding: 34px 36px 32px; }
    .composer h2 { font-size: 24px; margin: 0 0 22px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; color: var(--text-2); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .photo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .photo img { width: 96px; height: 64px; object-fit: cover; border-radius: 10px; }
    .cmsg { min-height: 20px; font-size: 13.5px; margin: 4px 0 0; color: #ff8a80; }
    .composer-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
    .confirm { padding: 30px 30px 26px; text-align: center; }
    .confirm .ico { width: 54px; height: 54px; border-radius: 50%; background: rgba(229,72,77,.14); color: #ff8a80; display: grid; place-items: center; margin: 0 auto 16px; }
    .confirm h2 { margin: 0 0 8px; font-size: 20px; }
    .confirm p { margin: 0 0 22px; color: var(--text-3); font-size: 14px; }
    .confirm .row-btns { display: flex; gap: 10px; justify-content: center; }

    #toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 80; background: #fff; color: #111; font-weight: 600; padding: 12px 22px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.error { background: var(--red); color: #fff; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1080px) {
      .wrap { padding-left: 32px; padding-right: 32px; }
      .list-head { display: none; }
      .item { grid-template-columns: 96px minmax(0, 1fr); grid-template-areas: "img main" "img meta" "ops ops"; row-gap: 10px; }
      .item .thumb { grid-area: img; }
      .item .main { grid-area: main; }
      .item .meta2 { grid-area: meta; display: flex; gap: 18px; align-items: center; }
      .item .ops { grid-area: ops; justify-content: flex-start; }
      .date small { display: inline; margin-left: 6px; }
    }
    @media (min-width: 1081px) { .item .meta2 { display: contents; } }
    @media (max-width: 760px) {
      .menu { display: none; }
      .nav { grid-template-columns: 1fr auto; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stats .stat:last-child { grid-column: span 2; }
      .count { width: 100%; margin-left: 0; }
      .search { max-width: none; }
    }
    @media (max-width: 560px) {
      .wrap { padding-left: 18px; padding-right: 18px; }
      .nav { height: 74px; }
      .ops .btn { flex: 1; }
      .grid2 { grid-template-columns: 1fr; }
      .overlay { padding: 0; }
      .sheet { border-radius: 0; min-height: 100%; }
      .composer { padding: 28px 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <header class="nav">
    <a class="logo" href="index.html">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6 3h7.5a4.5 4.5 0 0 1 3.2 7.66A4.75 4.75 0 0 1 14 20H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm2 2.5v4.25h5a2.12 2.12 0 0 0 0-4.25H8Zm0 6.75v5.25h5.75a2.62 2.62 0 0 0 0-5.25H8Z"/></svg></span>
      <span>Spring<span style="color:var(--blue)">.</span>Blog</span>
    </a>
    <nav class="menu" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="index.html#articles">Blog</a>
      <a href="my-posts.html" class="on" aria-current="page">My Posts</a>
    </nav>
    <div class="actions" id="actions"></div>
  </header>

  <section class="head">
    <div>
      <div class="crumb"><a href="index.html">Home</a> / My Posts</div>
      <h1>My Posts</h1>
      <p id="hello">Manage the articles you’ve published.</p>
    </div>
    <a class="btn primary" href="index.html#write" id="writeNew">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Write new article
    </a>
  </section>

  <section class="stats" id="stats" aria-label="Summary">
    <div class="stat"><div class="k">Total articles</div><div class="v" id="stTotal">–</div></div>
    <div class="stat"><div class="k">Categories used</div><div class="v" id="stCats">–</div></div>
    <div class="stat"><div class="k">Last published</div><div class="v" id="stLast">–</div></div>
  </section>

  <div class="toolbar">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search my posts..." aria-label="Search my posts" autocomplete="off" />
    </label>
    <select class="in" id="catFilter" aria-label="Filter by category"></select>
    <span class="count" id="count"></span>
  </div>

  <section class="list" aria-label="My articles">
    <div class="list-head"><span>Cover</span><span>Article</span><span>Category</span><span>Published</span><span style="text-align:right">Actions</span></div>
    <div id="items"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </section>
</div>

<footer>
  <div class="wrap"><span>©<span id="year"></span> Spring Blog. All rights reserved.</span><a href="index.html">← Back to all articles</a></div>
</footer>

<!-- Edit dialog -->
<div id="editor" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="editorTitle">
  <div class="sheet">
    <button class="close" data-close-editor aria-label="Close editor">&times;</button>
    <form class="composer" id="editForm" novalidate>
      <h2 id="editorTitle">Edit article</h2>
      <div class="field">
        <label for="postTitle">Title</label>
        <input class="in" id="postTitle" type="text" maxlength="150" />
      </div>
      <div class="grid2">
        <div class="field">
          <label for="postCategory">Category</label>
          <select class="in" id="postCategory"></select>
        </div>
        <div class="field">
          <label for="postPhoto">Change cover photo</label>
          <input class="in" id="postPhoto" type="file" accept="image/*" />
        </div>
      </div>
      <div class="photo" id="photoPreview" hidden>
        <img id="photoImg" alt="Cover preview" />
        <button type="button" class="btn outline sm" id="photoRemove">Remove photo</button>
      </div>
      <div class="field" style="margin-top:16px">
        <label for="postContent">Content</label>
        <textarea class="in" id="postContent" rows="12"></textarea>
      </div>
      <div class="cmsg" id="cmsg" role="alert"></div>
      <div class="composer-actions">
        <button type="button" class="btn outline" data-close-editor>Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete confirm -->
<div id="confirmBox" class="overlay" hidden role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="sheet" style="max-width:420px;margin-top:12vh">
    <div class="confirm">
      <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></div>
      <h2 id="confirmTitle">Delete this article?</h2>
      <p id="confirmText"></p>
      <div class="row-btns">
        <button class="btn outline" id="confirmNo">Cancel</button>
        <button class="btn danger-solid" id="confirmYes">Delete</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
  const API = "http://localhost:8080/api";
  const CATEGORIES = ["Tech", "Travel", "Lifestyle", "Education", "Food"];
  const CAT_COLOR = { Tech: "#2563ff", Travel: "#0fa3a3", Lifestyle: "#a855f7", Education: "#e0a100", Food: "#ec4899" };

  let currentUser = null;
  try { currentUser = JSON.parse(localStorage.getItem("blog_user") || "null"); } catch (e) {}
  // this page is only for signed-in users
  if (!currentUser) location.replace("login.html");

  let posts = [];
  let query = "";
  let catFilter = "ALL";
  let editingId = null;
  let hadPhoto = false;     // the post had a cover when the editor opened
  let removePhoto = false;  // user removed the existing cover
  let deleteId = null;
  let lastFocus = null;

  const $ = id => document.getElementById(id);

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }
  function colorOf(cat) { return CAT_COLOR[cat] || "#667085"; }
  function fmtDate(s) {
    const d = new Date(s);
    if (isNaN(d)) return "";
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())}`;
  }
  function fmtTime(s) {
    const d = new Date(s);
    return isNaN(d) ? "" : d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }
  function ago(s) {
    const d = new Date(s);
    if (isNaN(d)) return "–";
    const days = Math.floor((Date.now() - d.getTime()) / 864e5);
    if (days <= 0) return "Today";
    if (days === 1) return "Yesterday";
    if (days < 30) return days + " days ago";
    return fmtDate(s);
  }
  function excerpt(text, max) {
    const t = String(text || "").replace(/\s+/g, " ").trim();
    return t.length <= max ? t : t.slice(0, max).replace(/\s+\S*$/, "") + " ...";
  }
  function hue(name) {
    let h = 0;
    for (const ch of String(name || "?")) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return h;
  }
  function avatar(name, size) {
    const h = hue(name);
    return `<span class="avatar" style="width:${size}px;height:${size}px;background:hsl(${h} 70% 82%);color:hsl(${h} 60% 25%)">${esc(String(name || "?").charAt(0).toUpperCase())}</span>`;
  }
  function toast(msg, type) {
    const t = $("toast");
    t.textContent = msg;
    t.className = "show" + (type === "error" ? " error" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.className = ""; }, 3200);
  }
  async function errorMessage(res, fallback) {
    try { return (await res.json()).message || fallback; } catch (e) { return fallback; }
  }
  const ICON_EYE = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const ICON_EDIT = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  const ICON_TRASH = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>`;

  /* ---------- header ---------- */
  function renderActions() {
    if (!currentUser) return;
    const pic = currentUser.picture
      ? `<img class="avatar" referrerpolicy="no-referrer" src="${esc(currentUser.picture)}" alt="" />`
      : avatar(currentUser.username, 40);
    $("actions").innerHTML = `<span class="who" title="${esc(currentUser.username)}">${pic}</span><button class="linkbtn" id="signOut">Sign out</button>`;
    $("hello").textContent = `Hi ${currentUser.username}, manage the articles you’ve published.`;
  }

  /* ---------- data ---------- */
  async function loadPosts() {
    try {
      const res = await fetch(`${API}/posts/author/${encodeURIComponent(currentUser.userId)}`);
      if (res.status === 404) {
        const msg = await errorMessage(res, "");
        throw new Error(msg || "The server doesn’t have the My Posts endpoint yet. Replace PostController.java and restart the Spring Boot app.");
      }
      if (!res.ok) throw new Error("The server returned an error (" + res.status + "). Check the Spring Boot console.");
      posts = await res.json();
      posts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      render();
    } catch (e) {
      const why = e && e.message && e.message !== "Failed to fetch" ? e.message : "The server isn’t responding. Check that the app is running on port 8080.";
      $("items").innerHTML = `<div class="empty"><h2>Can’t load your posts</h2><p>${esc(why)}</p><button class="btn primary" data-retry>Try again</button></div>`;
      $("count").textContent = "";
    }
  }

  function visible() {
    const q = query.trim().toLowerCase();
    return posts.filter(p =>
      (catFilter === "ALL" || p.category === catFilter) &&
      (!q || [p.title, p.content, p.category].some(s => String(s || "").toLowerCase().includes(q))));
  }

  /* ---------- rendering ---------- */
  function renderStats() {
    $("stTotal").textContent = posts.length;
    const used = new Set(posts.map(p => p.category)).size;
    $("stCats").innerHTML = `${used} <small>of ${CATEGORIES.length}</small>`;
    $("stLast").textContent = posts.length ? ago(posts[0].createdAt) : "–";
  }

  function renderFilter() {
    const sel = $("catFilter");
    const n = c => posts.filter(p => p.category === c).length;
    sel.innerHTML = `<option value="ALL">All categories (${posts.length})</option>` +
      CATEGORIES.map(c => `<option value="${c}">${c} (${n(c)})</option>`).join("");
    sel.value = catFilter;
  }

  function itemHtml(p) {
    return `
      <article class="item">
        <div class="thumb">${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="" loading="lazy" />` : `<div class="ph" style="--c:${colorOf(p.category)}">${esc(String(p.category || "?").charAt(0))}</div>`}</div>
        <div class="main">
          <h3><a href="index.html#post-${p.id}">${esc(p.title)}</a></h3>
          <p class="ex">${esc(excerpt(p.content, 140))}</p>
        </div>
        <div class="meta2">
          <span class="tag"><span class="dot" style="--c:${colorOf(p.category)}"></span>${esc(p.category)}</span>
          <span class="date">${esc(fmtDate(p.createdAt))}<small>${esc(fmtTime(p.createdAt))}</small></span>
        </div>
        <div class="ops">
          <a class="btn outline sm" href="index.html#post-${p.id}" title="View article">${ICON_EYE}View</a>
          <button class="btn outline sm" data-edit="${p.id}">${ICON_EDIT}Edit</button>
          <button class="btn danger sm" data-delete="${p.id}">${ICON_TRASH}Delete</button>
        </div>
      </article>`;
  }

  function render() {
    renderStats();
    renderFilter();
    const list = visible();
    $("count").textContent = posts.length ? `Showing ${list.length} of ${posts.length}` : "";
    const box = $("items");
    if (posts.length === 0) {
      box.innerHTML = `<div class="empty">
        <div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
        <h2>No articles on this account yet</h2>
        <p>You’re signed in as <b style="color:#fff">${esc(currentUser.username)}</b>${currentUser.email ? ` (${esc(currentUser.email)})` : ""}.<br>
        Articles written while signed in with a different account show up under that account.</p>
        <a class="btn primary" href="index.html#write">Write your first article</a></div>`;
      return;
    }
    if (list.length === 0) {
      box.innerHTML = `<div class="empty"><h2>No posts match</h2><p>Try a different word or category.</p><button class="btn outline" data-clear>Clear filters</button></div>`;
      return;
    }
    box.innerHTML = list.map(itemHtml).join("");
  }

  /* ---------- overlays ---------- */
  function showOverlay(id) {
    const el = $(id);
    el.hidden = false;
    document.body.style.overflow = "hidden";
    requestAnimationFrame(() => el.classList.add("show"));
  }
  function hideOverlay(id) {
    const el = $(id);
    el.classList.remove("show");
    setTimeout(() => {
      el.hidden = true;
      if ($("editor").hidden && $("confirmBox").hidden) document.body.style.overflow = "";
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }, 180);
  }

  /* ---------- edit ---------- */
  function setPreview(src) {
    const old = $("photoImg").getAttribute("src");
    if (old && old.startsWith("blob:")) URL.revokeObjectURL(old);
    if (src) { $("photoImg").src = src; $("photoPreview").hidden = false; }
    else { $("photoImg").removeAttribute("src"); $("photoPreview").hidden = true; }
  }

  function openEditor(id) {
    const p = posts.find(x => x.id === id);
    if (!p) return;
    lastFocus = document.activeElement;
    editingId = id;
    hadPhoto = !!p.imageUrl;
    removePhoto = false;
    $("editForm").reset();
    $("cmsg").textContent = "";
    $("postTitle").value = p.title || "";
    $("postContent").value = p.content || "";
    $("postCategory").value = CATEGORIES.includes(p.category) ? p.category : CATEGORIES[0];
    setPreview(p.imageUrl || null);
    showOverlay("editor");
    $("editor").scrollTop = 0;
    setTimeout(() => $("postTitle").focus(), 60);
  }

  async function saveEdit(e) {
    e.preventDefault();
    const title = $("postTitle").value.trim();
    const content = $("postContent").value.trim();
    const photo = $("postPhoto").files[0];
    const msg = $("cmsg");
    msg.textContent = "";
    if (!title) { msg.textContent = "Add a title for your article."; $("postTitle").focus(); return; }
    if (!content) { msg.textContent = "The article can’t be empty."; $("postContent").focus(); return; }
    if (photo && photo.size > 10 * 1024 * 1024) { msg.textContent = "The photo is larger than 10 MB. Choose a smaller one."; return; }

    const fd = new FormData();
    fd.append("title", title);
    fd.append("content", content);
    fd.append("category", $("postCategory").value);
    fd.append("authorId", currentUser.userId);
    if (photo) fd.append("photo", photo);
    else if (removePhoto) fd.append("removePhoto", "true");

    const btn = $("saveBtn");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const res = await fetch(`${API}/posts/${editingId}`, { method: "PUT", body: fd });
      if (!res.ok) throw new Error(await errorMessage(res, "Couldn’t save your changes. Try again."));
      const updated = await res.json().catch(() => null);
      if (updated && updated.id) posts = posts.map(p => p.id === updated.id ? updated : p);
      else await loadPosts();
      hideOverlay("editor");
      render();
      toast("Changes saved");
    } catch (err) {
      msg.textContent = err.message;
    } finally {
      btn.disabled = false; btn.textContent = "Save changes";
    }
  }

  /* ---------- delete ---------- */
  function askDelete(id) {
    const p = posts.find(x => x.id === id);
    if (!p) return;
    lastFocus = document.activeElement;
    deleteId = id;
    $("confirmText").textContent = `“${p.title}” and all its comments will be permanently removed. This can’t be undone.`;
    showOverlay("confirmBox");
    setTimeout(() => $("confirmNo").focus(), 60);
  }

  async function doDelete() {
    const id = deleteId;
    if (id == null) return;
    const btn = $("confirmYes");
    btn.disabled = true; btn.textContent = "Deleting…";
    try {
      const res = await fetch(`${API}/posts/${id}?authorId=${encodeURIComponent(currentUser.userId)}`, { method: "DELETE" });
      if (!res.ok) throw new Error(await errorMessage(res, "Couldn’t delete the article. Try again."));
      posts = posts.filter(p => p.id !== id);
      deleteId = null;
      lastFocus = null;
      hideOverlay("confirmBox");
      render();
      toast("Article deleted");
    } catch (err) {
      toast(err.message, "error");
    } finally {
      btn.disabled = false; btn.textContent = "Delete";
    }
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    const t = e.target;
    const ed = t.closest("[data-edit]");
    if (ed) { openEditor(Number(ed.dataset.edit)); return; }
    const dl = t.closest("[data-delete]");
    if (dl) { askDelete(Number(dl.dataset.delete)); return; }
    if (t.closest("[data-close-editor]") || t === $("editor")) { hideOverlay("editor"); return; }
    if (t.closest("#confirmNo") || t === $("confirmBox")) { deleteId = null; hideOverlay("confirmBox"); return; }
    if (t.closest("#confirmYes")) { doDelete(); return; }
    if (t.closest("[data-retry]")) { loadPosts(); return; }
    if (t.closest("[data-clear]")) { query = ""; catFilter = "ALL"; $("search").value = ""; render(); return; }
    if (t.closest("#signOut")) { localStorage.removeItem("blog_user"); location.href = "index.html"; }
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!$("confirmBox").hidden) { deleteId = null; hideOverlay("confirmBox"); }
    else if (!$("editor").hidden) hideOverlay("editor");
  });
  $("editForm").addEventListener("submit", saveEdit);
  $("search").addEventListener("input", e => { query = e.target.value; render(); });
  $("catFilter").addEventListener("change", e => { catFilter = e.target.value; render(); });
  $("postPhoto").addEventListener("change", e => {
    const f = e.target.files[0];
    if (f) { setPreview(URL.createObjectURL(f)); }
    else { const p = posts.find(x => x.id === editingId); setPreview(!removePhoto && p ? p.imageUrl : null); }
  });
  $("photoRemove").addEventListener("click", () => {
    $("postPhoto").value = "";
    if (hadPhoto) removePhoto = true;
    setPreview(null);
  });

  /* ---------- start ---------- */
  if (currentUser) {
    $("year").textContent = new Date().getFullYear();
    $("postCategory").innerHTML = CATEGORIES.map(c => `<option>${c}</option>`).join("");
    renderActions();
    loadPosts();
  }
</script>
</body>
</html>
